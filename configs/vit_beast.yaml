# BEAST (standard ViT-MAE) — Stage 1 of two-stage training
# mask_ratio=0.75, no bottleneck, pretrained from facebook/vit-mae-base
model:
  seed: 0
  checkpoint: null
  model_class: vit
  model_params:
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 12
    intermediate_size: 3072
    hidden_act: "gelu"
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    initializer_range: 0.02
    layer_norm_eps: 1.e-12
    image_size: 224
    patch_size: 16
    num_channels: 3
    qkv_bias: True
    decoder_num_attention_heads: 16
    decoder_hidden_size: 512
    decoder_num_hidden_layers: 8
    decoder_intermediate_size: 2048
    mask_ratio: 0.75      # standard MAE masking
    norm_pix_loss: False
    num_latents: null      # no bottleneck — standard BEAST

    embed_size: 768
    temp_scale: False
    random_init: False     # start from facebook/vit-mae-base pretrained weights
    use_infoNCE: False
    infoNCE_weight: 0.03
    use_perceptual_loss: False
    lambda_perceptual: 10.0

# training configuration
training:
  seed: 0
  imgaug: none
  train_batch_size: 32
  val_batch_size: 1024
  test_batch_size: 32
  num_epochs: 400
  num_workers: 8
  num_gpus: 1
  num_nodes: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 5

# optimizer configuration
optimizer:
  type: Adam
  accumulate_grad_batches: 1
  lr: 5.e-5
  wd: 0.05
  warmup_pct: 0.15
  gamma: 0.95
  div_factor: 10
  scheduler: cosine

# data configuration
data:
  data_dir: /PATH/TO/DATA
